<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Battery Outer Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="gatePulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Emerald Linear Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Glass Capsule Reflection -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Rim -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Battery Terminal (Top Anode) -->
  <path d="M 216 68 L 296 68 C 304 68 310 74 310 82 L 310 98 L 202 98 L 202 82 C 202 74 208 68 216 68 Z" 
        fill="url(#cyanGrad)" filter="url(#emeraldGlow)"/>

  <!-- Main Battery Body Shell -->
  <rect x="136" y="98" width="240" height="346" rx="42" 
        fill="#0b1329" stroke="url(#emeraldGrad)" stroke-width="8" filter="url(#emeraldGlow)"/>

  <!-- Glass Inner Glow Layer -->
  <rect x="148" y="110" width="216" height="322" rx="32" 
        fill="rgba(16, 185, 129, 0.06)"/>

  <!-- Glossy Reflection Highlight -->
  <path d="M 152 114 Q 256 120 360 114 L 360 210 Q 256 250 152 210 Z" 
        fill="url(#glassGloss)"/>

  <!-- ChargeGate Shield / Gate Symbol -->
  <g filter="url(#gatePulse)">
    <!-- Shield Outline -->
    <path d="M 256 168 L 334 202 C 334 286 298 340 256 366 C 214 340 178 286 178 202 Z" 
          fill="rgba(15, 23, 42, 0.75)" stroke="url(#shieldBorder)" stroke-width="6"/>
    
    <!-- Inner Gate Protection Bars -->
    <path d="M 216 230 L 296 230" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <path d="M 226 262 L 286 262" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 238 294 L 274 294" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Energy Lightning Bolt -->
    <path d="M 264 192 L 238 250 L 260 250 L 246 306 L 278 242 L 254 242 Z" 
          fill="url(#emeraldGrad)"/>
  </g>

  <!-- 80% Threshold Indicator Line across battery -->
  <line x1="138" y1="180" x2="374" y2="180" 
        stroke="#10b981" stroke-dasharray="6,6" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Tiny 80% Threshold Badge on Line -->
  <rect x="306" y="168" width="58" height="24" rx="6" fill="#10b981"/>
  <text x="335" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#022c22" text-anchor="middle">80%</text>

  <!-- Bottom LED Base Glow Points -->
  <circle cx="216" cy="414" r="5" fill="#10b981"/>
  <circle cx="256" cy="414" r="5" fill="#38bdf8"/>
  <circle cx="296" cy="414" r="5" fill="#10b981"/>
</svg>

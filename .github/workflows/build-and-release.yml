name: Build and Release ChargeGate

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Package Windows Standalone
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore Dependencies
      run: dotnet restore ChargeGate.sln

    - name: Build Solution
      run: dotnet build ChargeGate.sln -c Release --no-restore

    - name: Publish Single-File Standalone Executable
      run: >
        dotnet publish src/ChargeGate.UI/ChargeGate.UI.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o publish/

    - name: Create Release Zip
      shell: pwsh
      run: |
        Compress-Archive -Path publish/* -DestinationPath ChargeGate-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChargeGate-win-x64
        path: ChargeGate-win-x64.zip

    - name: Create GitHub Release (On Tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ChargeGate-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
